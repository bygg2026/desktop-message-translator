name: Translator Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
      - name: Set reproducible build creation time
        shell: pwsh
        run: |
          "SOURCE_DATE_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/.build-temp" | Out-Null
          "TEMP=$env:GITHUB_WORKSPACE/.build-temp" >> $env:GITHUB_ENV
          "TMP=$env:GITHUB_WORKSPACE/.build-temp" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=$env:GITHUB_WORKSPACE/.builder-cache" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - name: Translation and build-time regression tests
        run: node --test --test-isolation=none scripts/translation-service.test.mjs scripts/build-time.test.mjs scripts/account-profiles.test.mjs
      - run: pnpm --filter @signalapp/windows-ucv run build
      - run: pnpm --filter @signalapp/types run build
      - run: pnpm --filter @signalapp/mock-server run build:protobuf
      - run: pnpm run generate
      - run: pnpm run check:types
      - name: Compile Windows authentication native binding
        run: node scripts/build-windows-ucv.mjs
      - name: Verify required Windows native artifacts
        run: node scripts/check-native-artifacts.mjs
      - name: Smoke test normal application startup and translation IPC
        run: node scripts/smoke-translator.cjs
      - name: Build unsigned installer without publishing
        run: pnpm run build:release --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-message-translator-windows-x64
          path: release/*.exe
          if-no-files-found: error
